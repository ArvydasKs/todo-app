<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Užduočių tvarkyklė</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="/static/js/theme.js?v=1"></script>
    <script>if (!localStorage.getItem('token')) window.location.replace('/login');</script>
</head>
<body>
<div class="container">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></button>
    <h1>Užduočių tvarkyklė</h1>

    <nav class="app-nav">
        <a href="/" class="nav-link active">Užduotys</a>
        <a href="/categories" class="nav-link">Kategorijos</a>
        <a href="/calendar" class="nav-link">Kalendorius</a>
        <a href="/settings" class="nav-link">Nustatymai</a>
    </nav>

    <div id="tasks-section" style="display:none">
        <div class="tasks-box">
            <div class="tasks-header">
                <h2>Mano užduotys</h2>
                <button class="danger" onclick="logout()">Atsijungti</button>
            </div>
            <div class="task-form">
                <input type="text" id="task-title" placeholder="Užduoties pavadinimas">
                <input type="text" id="task-desc" placeholder="Aprašymas (neprivaloma)">
                <input type="datetime-local" id="task-due" placeholder="Terminas (neprivaloma)">
                <select id="task-priority">
                    <option value="low">Žemas</option>
                    <option value="medium" selected>Vidutinis</option>
                    <option value="high">Aukštas</option>
                </select>
                <select id="task-category">
                    <option value="">-- Kategorija (neprivaloma) --</option>
                </select>
                <button class="secondary" onclick="createTask()">Pridėti</button>
            </div>
            <div id="tasks-message"></div>
            <div class="tasks-controls">
                <div class="priority-filters">
                    <span class="filter-label">Rodyti:</span>
                    <label class="priority-filter-label low-label">
                        <input type="checkbox" id="filter-low" checked> Žemas
                    </label>
                    <label class="priority-filter-label medium-label">
                        <input type="checkbox" id="filter-medium" checked> Vidutinis
                    </label>
                    <label class="priority-filter-label high-label">
                        <input type="checkbox" id="filter-high" checked> Aukštas
                    </label>
                </div>
                <div class="sort-controls">
                    <label for="filter-category" class="filter-label">Kategorija:</label>
                    <select id="filter-category">
                        <option value="">Visos</option>
                    </select>
                    <label for="tasks-filter" class="filter-label">Rūšiuoti pagal:</label>
                    <select id="tasks-filter">
                        <option value="created" selected>Sukūrimo datą</option>
                        <option value="due">Terminą</option>
                        <option value="priority">Prioritetą</option>
                    </select>
                </div>
            </div>
            <div id="tasks-list"></div>
        </div>
    </div>
</div>
<script src="/static/js/utils.js?v=4"></script>
<script src="/static/js/tasks.js?v=4"></script>
</body>
</html>
